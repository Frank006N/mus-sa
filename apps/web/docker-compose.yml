services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mut_sa
      POSTGRES_USER: mut_sa
      POSTGRES_PASSWORD: mut_sa_dev
    ports: ["5433:5432"]
    volumes: 
      - mut_sa_pgdata:/var/lib/postgresql/data
      - ./drizzle/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mut_sa -d mut_sa"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: pgbouncer/pgbouncer:1.23.1
    environment:
      DATABASES: "* = host=postgres port=5432 dbname=mut_sa user=mut_sa password=mut_sa_dev"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 6000
      DEFAULT_POOL_SIZE: 80
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: mut_sa
    ports: ["6432:6432"]
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["mut_sa_redis:/data"]

